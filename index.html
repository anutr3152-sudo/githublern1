<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Management Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:220px;
      height:100vh;
      background:#111827;
      color:white;
      padding:20px;
      position:fixed;
    }

    .sidebar h2{
      margin-bottom:30px;
      text-align:center;
    }

    .sidebar ul{
      list-style:none;
    }

    .sidebar ul li{
      padding:15px;
      margin-bottom:10px;
      background:#1f2937;
      border-radius:8px;
      cursor:pointer;
    }

    .sidebar ul li:hover{
      background:#374151;
    }

    /* MAIN CONTENT */

    .main{
      margin-left:240px;
      width:100%;
      padding:20px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .top h1{
      color:#111827;
    }

    /* FORM */

    .task-form{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .task-form input,
    .task-form select{
      width:100%;
      padding:12px;
      margin-top:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:8px;
    }

    .task-form button{
      width:100%;
      padding:12px;
      background:#111827;
      color:white;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }

    .task-form button:hover{
      background:#2563eb;
    }

    /* TASK LIST */

    .task-container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .task-card{
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .task-card h3{
      margin-bottom:10px;
      color:#111827;
    }

    .task-card p{
      margin-bottom:8px;
    }

    .status{
      padding:5px 10px;
      border-radius:5px;
      color:white;
      display:inline-block;
      margin-bottom:10px;
    }

    .Pending{
      background:orange;
    }

    .Completed{
      background:green;
    }

    .InProgress{
      background:blue;
    }

    .task-card button{
      padding:8px 12px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-right:10px;
      color:white;
    }

    .delete-btn{
      background:red;
    }

    .complete-btn{
      background:green;
    }

    @media(max-width:768px){

      .sidebar{
        width:100%;
        height:auto;
        position:relative;
      }

      .main{
        margin-left:0;
      }

      body{
        flex-direction:column;
      }
    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <h2>Dashboard</h2>

    <ul>
      <li>Home</li>
      <li>Tasks</li>
      <li>Analytics</li>
      <li>Settings</li>
      <li>Logout</li>
    </ul>

  </div>

  <!-- MAIN -->

  <div class="main">

    <div class="top">
      <h1>Task Management Dashboard</h1>
    </div>

    <!-- FORM -->

    <div class="task-form">

      <input type="text" id="taskTitle" placeholder="Enter Task Name">

      <input type="date" id="taskDate">

      <select id="taskStatus">
        <option value="Pending">Pending</option>
        <option value="InProgress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>

      <button onclick="addTask()">Add Task</button>

    </div>

    <!-- TASKS -->

    <div class="task-container" id="taskContainer">

    </div>

  </div>

  <script>

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks(){
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function displayTasks(){

      let container = document.getElementById("taskContainer");

      container.innerHTML = "";

      tasks.forEach((task,index)=>{

        container.innerHTML += `

          <div class="task-card">

            <h3>${task.title}</h3>

            <p><b>Deadline:</b> ${task.date}</p>

            <span class="status ${task.status}">
              ${task.status}
            </span>

            <br><br>

            <button class="complete-btn"
            onclick="completeTask(${index})">
            Complete
            </button>

            <button class="delete-btn"
            onclick="deleteTask(${index})">
            Delete
            </button>

          </div>

        `;
      });

    }

    function addTask(){

      let title = document.getElementById("taskTitle").value;

      let date = document.getElementById("taskDate").value;

      let status = document.getElementById("taskStatus").value;

      if(title === "" || date === ""){

        alert("Please fill all fields");

        return;
      }

      let task = {
        title,
        date,
        status
      };

      tasks.push(task);

      saveTasks();

      displayTasks();

      document.getElementById("taskTitle").value = "";

      document.getElementById("taskDate").value = "";

    }

    function deleteTask(index){

      tasks.splice(index,1);

      saveTasks();

      displayTasks();

    }

    function completeTask(index){

      tasks[index].status = "Completed";

      saveTasks();

      displayTasks();

    }

    displayTasks();

  </script>

</body>
</html>
